[main]
dpi-aware=no
font=JetBrains Mono Nerd Font:size=10
anchor=center
width=28
lines=8
horizontal-pad=20
vertical-pad=15
inner-pad=12
line-height=24
prompt=""
placeholder=" Search.."
icons-enabled=yes
image-size-ratio=0
icon-theme=Papirus-Dark
fields=filename,name,generic,categories

[colors]
background=1e222af7
text=abb2bfff
prompt=abb2bfff
placeholder=abb2bfff
input=abb2bfff
match=abb2bfff
selection=353b45f7
selection-text=abb2bfff
selection-match=abb2bfff
border=abb2bfff

[border]
width=1
radius=0
selection-radius=0

[key-bindings]
cancel=Escape Control+c
execute=Return KP_Enter
cursor-left-word=Control+Left Mod1+Left
cursor-right-word=Control+Right Mod1+Right
delete-prev-word=Mod1+BackSpace Control+BackSpace Control+w
prev=none
next=none
prev-with-wrap=Up Control+p Mod1+k ISO_Left_Tab
next-with-wrap=Down Control+n Mod1+j
